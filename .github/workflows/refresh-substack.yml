name: Refresh Substack posts

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/refresh-substack.yml"
      - "scripts/fetch_substack.py"
  schedule:
    - cron: "23 */6 * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Fetch posts through RSS proxy
        run: python scripts/fetch_substack.py

      - name: Commit refreshed posts
        run: |
          if git diff --quiet posts.json; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts.json
          git commit -m "Refresh latest Substack posts"
          git push
