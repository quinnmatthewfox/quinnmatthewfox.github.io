name: Refresh Substack posts

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "trigger-substack.txt"
  schedule:
    - cron: "23 */3 * * *"

concurrency:
  group: refresh-substack-posts
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Refresh posts (best effort)
        continue-on-error: true
        run: python scripts/fetch_substack.py

      - name: Publish refreshed posts (best effort)
        continue-on-error: true
        run: |
          if git diff --quiet posts.json; then
            echo "No new posts to publish; cached feed remains in place."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add posts.json
          git commit -m "Refresh latest Substack posts"

          # The website repo may have changed while the fetch was running.
          # Rebase first so a harmless concurrent site edit does not make this job fail.
          if ! git pull --rebase origin main; then
            git rebase --abort || true
            echo "Repository changed during refresh. Keeping the existing cached feed; next scheduled run will retry."
            exit 0
          fi

          if ! git push; then
            echo "A concurrent update won the race. Keeping the existing cached feed; next scheduled run will retry."
            exit 0
          fi
